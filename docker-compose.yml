version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerooptima-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Predictive Air Traffic Delay & Airport Gate Scheduling Optimizer
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///./airport.db
      - OPTIMIZER_BACKEND=ortools
      - MODEL_PATH=../models/delay_model.joblib
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
    volumes:
      - ./backend/airport.db:/app/airport.db
      - ./models:/models
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerooptima-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
