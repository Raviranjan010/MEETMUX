services:
  postgres:
    image: postgres:16-alpine
    container_name: runwayoptx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-runwayoptx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d runwayoptx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: runwayoptx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/runwayoptx
      PORT: 8000
      HOST: 0.0.0.0
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:80
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-runwayoptx2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-runwayoptx-super-secret-key-at-least-32-chars-long-2026}
      OPTIMIZER_TIMEOUT_SECONDS: 60
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/backend/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: runwayoptx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"

volumes:
  postgres_data:
